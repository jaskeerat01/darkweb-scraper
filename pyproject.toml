[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkweb-scraper"
version = "2.0.0"
description = "Production-grade Dark Web Threat Intelligence Engine"
authors = [{ name = "Threat Intelligence Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.11.0",
    "aiohttp-socks>=0.10.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "python-dotenv>=1.0.1",
    "stem>=1.8.2",
    "APScheduler>=3.11.0,<4.0.0",
    "llama-cpp-python>=0.3.0",
]

[project.scripts]
scraper = "scraper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]