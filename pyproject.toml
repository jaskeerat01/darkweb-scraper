[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkweb-scraper"
version = "2.1.0"
description = "Production-grade Dark Web Threat Intelligence Engine"
authors = [{ name = "Threat Intelligence Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.11.0",
    "aiohttp-socks>=0.10.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "python-dotenv>=1.0.1",
    "stem>=1.8.2",
    "APScheduler>=3.11.0,<4.0.0",
    "llama-cpp-python>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
scraper = "scraper.__main__:run"
darkweb-dashboard = "scraper.dashboard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"scraper.dashboard" = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
